<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iporã Premiada - App do Cidadão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #e9ecef; font-family: sans-serif; }
        .mobile-container { max-width: 400px; margin: 20px auto; background: white; min-height: 90vh; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .app-header { background: #198754; color: white; padding: 20px; text-align: center; }
        .app-content { padding: 20px; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .coupon-card { border-left: 5px solid #198754; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="app-header">
            <h4>Iporã Premiada</h4>
            <small>Transforme suas notas em prêmios!</small>
        </div>

        <div class="app-content">
            <div id="login-section">
                <label class="form-label">Informe seu CPF para começar:</label>
                <input type="text" id="cpf_cidadao" class="form-control mb-3" placeholder="000.000.000-00">
                <button onclick="iniciarApp()" class="btn btn-success w-100">Entrar</button>
            </div>

            <div id="main-section" style="display: none;">
                <p>Olá, <strong id="display-cpf"></strong>!</p>
                
                <div class="card p-3 mb-4 text-center">
                    <h6>Registrar Nova Nota</h6>
                    <div id="reader"></div>
                    <button id="btn-scan" onclick="startScanner()" class="btn btn-primary">Ativar Câmera</button>
                </div>

                <h6>Meus Cupons</h6>
                <div id="meus-cupons">
                    <!-- Cupons aparecerão aqui -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dica: Para testar no celular, substitua 'localhost' pelo IP do seu computador na rede (ex: 192.168.0.10)
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? "http://127.0.0.1:8000" : `http://${window.location.hostname}:8000`;
        let html5QrCode;

        function iniciarApp() {
            const cpf = document.getElementById('cpf_cidadao').value;
            if (cpf.length < 11) return alert("CPF Inválido");
            
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-section').style.display = 'block';
            document.getElementById('display-cpf').innerText = cpf;
            atualizarCupons();
        }

        async function atualizarCupons() {
            const cpf = document.getElementById('cpf_cidadao').value;
            try {
                const res = await fetch(`${API_URL}/usuarios/${cpf}/cupons`);
                const data = await res.json();
                const container = document.getElementById('meus-cupons');
                container.innerHTML = "";
                
                if(data.cupons) {
                    data.cupons.forEach(c => {
                        container.innerHTML += `
                            <div class="card coupon-card p-2">
                                <strong>Número: ${c.numero}</strong>
                                <small class="text-muted">Gerado em: ${new Date(c.data_geracao).toLocaleDateString()}</small>
                            </div>
                        `;
                    });
                }
            } catch (e) { console.log("Nenhum cupom ainda."); }
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            document.getElementById('btn-scan').style.display = 'none';
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    processarLeitura(decodedText);
                }
            ).catch(err => {
                alert("Erro ao acessar câmera: " + err);
                document.getElementById('btn-scan').style.display = 'block';
            });
        }

        async function processarLeitura(url) {
            // Tenta extrair a chave de 44 dígitos da URL do QR Code
            const match = url.match(/(?:p|chNFe)=(\d{44})/) || url.match(/(\d{44})/);
            if (!match) {
                alert("QR Code inválido. Certifique-se de estar lendo uma Nota Fiscal.");
                return;
            }

            const chave = match[1];
            const cpf = document.getElementById('cpf_cidadao').value;

            // Para o scanner após a leitura
            await html5QrCode.stop();
            document.getElementById('btn-scan').style.display = 'block';

            // Envia para o backend
            try {
                const res = await fetch(`${API_URL}/notas/registrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cpf_usuario: cpf,
                        chave_danfe: chave,
                        tipo: "PRODUTO"
                    })
                });

                const result = await res.json();
                if (res.ok) {
                    alert("Sucesso! Cupons gerados: " + result.cupons.join(", "));
                    atualizarCupons();
                } else {
                    alert("Erro: " + result.detail);
                }
            } catch (e) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
